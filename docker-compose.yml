# PostgreSQL Service
services:
    postgres:
        image: postgres:18.3-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./data:/var/lib/postgresql/data

volumes:
    postgres_data: